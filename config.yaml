# StockLong configuration - NSE Options Buying Blueprint implementation.

upstox:
  # Create an app at https://account.upstox.com/developer/apps
  # Secrets are NOT read from this file; export them as environment variables:
  #   UPSTOX_API_KEY, UPSTOX_API_SECRET, UPSTOX_REDIRECT_URI
  # Must exactly match the redirect URI configured on your Upstox app.
  # The dashboard's OAuth callback listens here (scripts/webapp.py, port 8080).
  redirect_uri: "http://localhost:8080/callback"
  token_path: "data/access_token.json"

# When true, orders are logged and persisted but NEVER sent to the exchange.
# Flip to false only after you have validated the system end to end.
paper_trading: true

# The stock universe is NEVER hardcoded: at every application start it is
# rebuilt from the exchange's live instrument master (all NSE stocks that
# currently have F&O options listed).
universe:
  refresh_on_start: true   # re-download the instrument master on startup
  max_symbols: 0           # 0 = scan the entire F&O universe; N = first N symbols

# Full-universe scans run only TWICE a day: at market opening and near the
# close. The opening scan's #1 setup becomes the day's pick, which is then
# tracked on an interval for the rest of the session (score + LTP snapshots).
scan:
  top_n: 25                   # scoreboard rows shown (0 = all)
  track_interval_minutes: 15  # how often the day's pick is re-scored intraday
  closing_scan_time: "15:20"  # IST; the second (end-of-day) full scan

history:
  daily_lookback_days: 400      # enough for Ichimoku 52 + shift 26 on daily
  hourly_lookback_days: 60

strategies:
  institutional_filter:
    enabled: true
    trigger_lookback_bars: 3    # TK cross + MACD cross must both fire within N hourly bars
    macd_zero_tolerance_pct: 0.001   # "near or below zero" = macd <= 0.1% of price
  renko_noise_killer:
    enabled: true
    box_mode: atr               # atr | percent
    atr_period: 14
    percent_box: 0.01           # 1% of spot when box_mode == percent

risk:
  # Blueprint: ITM contracts, delta 0.70-0.85, far month (T+2/T+3), limit orders only.
  delta_min: 0.70
  delta_max: 0.85
  expiry_months_ahead_min: 2
  expiry_months_ahead_max: 3
  # Ironclad rule: square off at least 5 trading days before expiry (physical settlement).
  square_off_days_before_expiry: 5
  max_open_positions: 4
  capital_per_trade_pct: 0.10   # max fraction of capital deployed per position
  limit_order_buffer_pct: 0.005 # place BUY limit 0.5% above LTP, SELL 0.5% below

store:
  db_path: "data/positions.db"
